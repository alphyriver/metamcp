name: Build and release MetaMCP

on:
  push:
    branches:
      - umbrella
    # Only rebuild when something that actually feeds the Docker image
    # changes. Cross-checked against every Dockerfile COPY + the turbo
    # pipeline's globalDependencies (none outside apps/**, packages/**).
    # Docs (*.md, docs/**) are also .dockerignore'd, so they never touch
    # the build output either.
    paths:
      - "apps/**"
      - "packages/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      # The entrypoint shells out to scripts/, and the Dockerfile COPYs the
      # whole directory, so a change confined to a script feeds the image
      # like any source change. Omitted, it would leave the published image
      # running the previous version of a script with nothing to say so.
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".dockerignore"
      - ".github/workflows/umbrella-build.yml"
      - ".github/workflows/upstream-sync.yml"
  pull_request:
    branches:
      - umbrella
  workflow_dispatch:

concurrency:
  group: metamcp-umbrella-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # NOTE: this workflow builds, tags and releases the image. Tests and
  # check-types run in umbrella-ci.yml, on the same push/PR-to-`umbrella`
  # triggers. `lint` is still deliberately ungated anywhere: upstream `main`
  # carries pre-existing eslint warnings that `--max-warnings 0` turns into a
  # failure, and they aren't caused by our cherry-picks. Tracked as a
  # follow-up — see UMBRELLA_FORK.md "Our own patches" backlog.
  build-and-release:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/umbrella') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/umbrella')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Select release version
        id: version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          existing="$(git tag --points-at "$GITHUB_SHA" --list '[0-9]*.[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [ -n "$existing" ]; then
            echo "value=$existing" >> "$GITHUB_OUTPUT"
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          day="$(date -u +%Y.%m.%d)"
          next=1
          while IFS= read -r tag; do
            suffix="${tag#"$day."}"
            if [[ "$suffix" =~ ^[0-9]+$ ]] && (( suffix >= next )); then
              next=$((suffix + 1))
            fi
          done < <(git tag --list "$day.*")
          echo "value=$day.$next" >> "$GITHUB_OUTPUT"
          echo "already_tagged=false" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=,format=long

      - id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ github.event_name != 'pull_request' && steps.meta.outputs.tags || '' }}
          labels: ${{ github.event_name != 'pull_request' && steps.meta.outputs.labels || '' }}
          cache-from: type=gha,scope=metamcp-umbrella
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=metamcp-umbrella' || '' }}

      - name: Create the source tag
        if: github.event_name != 'pull_request' && steps.version.outputs.already_tagged == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.value }}" "$GITHUB_SHA" -m "MetaMCP ${{ steps.version.outputs.value }}"
          git push origin "${{ steps.version.outputs.value }}"

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          gh release view "$version" >/dev/null 2>&1 || \
            gh release create "$version" \
              --title "MetaMCP $version" \
              --notes "Built from $GITHUB_SHA. Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$version"
