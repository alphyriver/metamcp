name: Build and release MetaMCP

on:
  push:
    branches:
      - umbrella
    # Only rebuild when something that actually feeds the Docker image
    # changes. Cross-checked against every Dockerfile COPY + the turbo
    # pipeline's globalDependencies (none outside apps/**, packages/**).
    # Docs (*.md, docs/**) are also .dockerignore'd, so they never touch
    # the build output either.
    paths:
      - "apps/**"
      - "packages/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".dockerignore"
      - ".github/workflows/umbrella-build.yml"
      - ".github/workflows/upstream-sync.yml"
  pull_request:
    branches:
      - umbrella
  workflow_dispatch:

concurrency:
  group: metamcp-umbrella-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/umbrella') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/umbrella')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release version
        id: version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          existing="$(git tag --points-at "$GITHUB_SHA" --list '[0-9]*.[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [ -n "$existing" ]; then
            echo "value=$existing" >> "$GITHUB_OUTPUT"
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          day="$(date -u +%Y.%m.%d)"
          next=1
          while IFS= read -r tag; do
            suffix="${tag#"$day."}"
            if [[ "$suffix" =~ ^[0-9]+$ ]] && (( suffix >= next )); then
              next=$((suffix + 1))
            fi
          done < <(git tag --list "$day.*")
          echo "value=$day.$next" >> "$GITHUB_OUTPUT"
          echo "already_tagged=false" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=,format=long

      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ github.event_name != 'pull_request' && steps.meta.outputs.tags || '' }}
          labels: ${{ github.event_name != 'pull_request' && steps.meta.outputs.labels || '' }}
          cache-from: type=gha,scope=metamcp-umbrella
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=metamcp-umbrella' || '' }}

      - name: Create the source tag
        if: github.event_name != 'pull_request' && steps.version.outputs.already_tagged == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git tag -a "${{ steps.version.outputs.value }}" "$GITHUB_SHA" -m "MetaMCP ${{ steps.version.outputs.value }}"
          git push origin "${{ steps.version.outputs.value }}"

      - uses: actions/attest-build-provenance@v2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          gh release view "$version" >/dev/null 2>&1 || \
            gh release create "$version" \
              --title "MetaMCP $version" \
              --notes "Built from $GITHUB_SHA. Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$version"
