name: GHCR cleanup

# Manual-only retention sweep for this fork's GHCR packages. No schedule —
# fire it by hand when the package listing gets noisy. Defaults to a
# dry-run and keeps the latest 30 tagged releases. It never removes the
# `latest` convenience tag or a deployed calendar-version rollback target.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only"
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: alphyriver
          packages: metamcp
          delete-untagged: true
          keep-n-tagged: 30
          exclude-tags: latest
          dry-run: ${{ inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}
