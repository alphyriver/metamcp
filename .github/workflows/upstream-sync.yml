name: Sync Umbrella upstream

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: metamcp-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Check out the fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: umbrella
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch Umbrella's integration branch
        run: |
          set -euo pipefail
          git remote add umbrella-upstream https://github.com/Umbrella-IT-Group/metamcp.git 2>/dev/null || true
          git fetch --no-tags umbrella-upstream umbrella

      - name: Create or refresh the sync pull request
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse origin/umbrella)"
          upstream="$(git rev-parse umbrella-upstream/umbrella)"
          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Umbrella is already synchronized." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git switch --force-create automation/sync-umbrella "$base"
          git config user.name "alphyriver sync bot"
          git config user.email "actions@github.com"
          if ! git merge --no-ff "$upstream" -m "chore(sync): merge Umbrella upstream"; then
            # Files the fork deleted on purpose (.github/sync-keep-deleted.txt)
            # stay deleted: a modify/delete conflict on exactly those paths is
            # resolved here. Anything else is a real conflict for a human.
            keep_deleted="$(grep -v '^[[:space:]]*\(#\|$\)' .github/sync-keep-deleted.txt 2>/dev/null || true)"
            while IFS= read -r line; do
              status="${line:0:2}"; path="${line:3}"
              if [ "$status" = "DU" ] && grep -Fxq -- "$path" <<<"$keep_deleted"; then
                git rm --quiet -- "$path"
                echo "Kept deleted (sync-keep-deleted.txt): $path" >> "$GITHUB_STEP_SUMMARY"
              fi
            done < <(git status --porcelain)
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "$conflicts" ]; then
              git merge --abort
              # A reconciliation PR from a branch this fork owns, so the
              # conflicts can be resolved on it (merge umbrella into it). A PR
              # straight from Umbrella-IT-Group:umbrella could never be fixed here.
              git push --force origin "$upstream:refs/heads/automation/reconcile-umbrella"
              body="$(printf 'The weekly sync could not merge Umbrella-IT-Group/metamcp@%s.\n\nConflicting paths:\n%s\n\nResolve on this branch: `git fetch origin && git switch automation/reconcile-umbrella && git merge origin/umbrella`, fix the conflicts, push. A path the fork deleted on purpose belongs in `.github/sync-keep-deleted.txt`, so the next sync keeps it deleted on its own.' "$upstream" "$(sed 's/^/- `/; s/$/`/' <<<"$conflicts")")"
              existing="$(gh pr list --base umbrella --head automation/reconcile-umbrella --state open --json number --jq '.[0].number // empty')"
              if [ -z "$existing" ]; then
                gh pr create --base umbrella --head automation/reconcile-umbrella \
                  --title "chore(sync): reconcile Umbrella upstream" --body "$body"
              else
                gh pr edit "$existing" --body "$body"
              fi
              echo "Umbrella sync has merge conflicts in: $(tr '\n' ' ' <<<"$conflicts"). Reconciliation PR is open." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            git commit --no-edit --quiet
          fi

          git push --force-with-lease origin HEAD:refs/heads/automation/sync-umbrella
          pr="$(gh pr list --base umbrella --head automation/sync-umbrella --state open --json number --jq ".[0].number")"
          if [ -z "$pr" ]; then
            pr="$(gh pr create \
              --base umbrella \
              --head automation/sync-umbrella \
              --title "chore(sync): merge Umbrella upstream" \
              --body "Automated weekly sync from Umbrella-IT-Group/metamcp@${upstream}.")"
          fi
          gh pr merge "$pr" --auto --merge
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Enabled auto-merge for sync PR #$pr." >> "$GITHUB_STEP_SUMMARY"
